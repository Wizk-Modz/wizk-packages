name: Publish from artifact

# Publish các *.deb có sẵn trong artifact của một workflow run lên
# APT repository trên branch gh-pages, không cần build lại.
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "ID của workflow run chứa artifact debs-aarch64-<sha>"
        required: true
      sha:
        description: "Commit SHA dùng trong tên artifact (mặc định: lấy từ run)"
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-from-artifact
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Download *.deb artifact
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RUN_ID="${{ github.event.inputs.run-id }}"
        SHA="${{ github.event.inputs.sha }}"
        if [ -z "$SHA" ]; then
          SHA=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" --jq '.head_sha')
        fi
        echo "Dùng run-id=$RUN_ID sha=$SHA"
        ARTIFACT_NAME="debs-aarch64-${SHA}"

        # Không dùng `gh run download` vì nó từ chối artifact chứa tên file
        # có ký tự đặc biệt (lỗi path traversal). Tải trực tiếp qua API.
        ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
          --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id")
        if [ -z "$ARTIFACT_ID" ]; then
          echo "::error::không tìm thấy artifact '${ARTIFACT_NAME}' trong run ${RUN_ID}"
          exit 1
        fi

        curl -sSL -H "Authorization: token ${GH_TOKEN}" \
          -o artifact.zip \
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip"
        # Giải nén ra ngoài repo để không xung đột với checkout gh-pages.
        mkdir -p "${RUNNER_TEMP}/debs-dl"
        unzip -oq artifact.zip -d "${RUNNER_TEMP}/debs-dl"
        mkdir -p debs
        for archive in "${RUNNER_TEMP}/debs-dl"/*.tar; do
          tar xf "$archive" -C "${RUNNER_TEMP}/debs-dl"
        done
        cp -f "${RUNNER_TEMP}/debs-dl/debs"/*.deb debs/ 2>/dev/null || true
        cp -f "${RUNNER_TEMP}/debs-dl/debs"/built_*_packages.txt debs/ 2>/dev/null || true
        echo "Số .deb: $(ls debs/*.deb 2>/dev/null | wc -l)"
    - name: Install publishing tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg bzip2
    - name: Import GPG signing key
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        if [ -z "$GPG_PRIVATE_KEY" ]; then
          echo "::error::secret GPG_PRIVATE_KEY is not set, refusing to publish an unsigned repository"
          exit 1
        fi
        echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}' > /tmp/gpg-fpr
        echo "GPG_KEY_FPR=$(cat /tmp/gpg-fpr)" >> "$GITHUB_ENV"
    - name: Checkout gh-pages branch
      env:
        GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
      run: |
        if [ -z "$GH_PAGES_TOKEN" ]; then
          echo "::error::secret GH_PAGES_TOKEN is not set"
          exit 1
        fi
        # Dùng thư mục ngoài repo để tránh lẫn file của repo source vào gh-pages.
        SITE="${RUNNER_TEMP}/site"
        echo "SITE_DIR=${SITE}" >> "$GITHUB_ENV"
        mkdir -p "$SITE"
        cd "$SITE"
        git init -q
        git remote add origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/Wizk-Modz/wizk-apt-repo.git"
        git config user.name "Wizk-BOT"
        git config user.email "wizk-bot@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
          git fetch -q origin gh-pages
          git checkout -q -b gh-pages origin/gh-pages
        else
          echo "gh-pages branch does not exist yet, creating an orphan branch"
          git checkout -q --orphan gh-pages
        fi
    - name: Publish packages to gh-pages
      run: |
        ./scripts/publish-apt-repo.sh "$SITE_DIR" debs
    - name: Commit and push gh-pages
      run: |
        cd "$SITE_DIR"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to publish"
          exit 0
        fi
        git commit -q -m "publish: update APT repository [skip ci]"
        git push -q origin gh-pages
