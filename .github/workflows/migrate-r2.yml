name: Migrate APT repo to R2

# Chuyển APT repository từ GitLab Pages sang Cloudflare R2 một lần.
# Chạy trên runner để không phải tải 1.6 GB về máy: clone repo GitLab (Git LFS),
# đổi layout bỏ tiền tố apt/, rồi đồng bộ thẳng lên bucket.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Chỉ dựng thư mục đích và kiểm tra, không upload lên R2"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: migrate-r2
  cancel-in-progress: false

jobs:
  migrate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Clone repository
      uses: actions/checkout@v7

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends git-lfs rclone jq
        git lfs install
        rclone version | head -1

    - name: Migrate to R2
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      run: |
        if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
          echo "::error::secret R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY hoặc R2_ENDPOINT chưa được đặt"
          exit 1
        fi
        chmod +x scripts/migrate-gitlab-to-r2.sh scripts/verify-apt-repo.sh scripts/apt-repo-index.sh
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          ./scripts/migrate-gitlab-to-r2.sh --no-upload
        else
          ./scripts/migrate-gitlab-to-r2.sh
        fi
